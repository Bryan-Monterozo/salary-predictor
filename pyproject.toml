[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "salary-predictor"
version = "0.0.0a1"
description = "Philippine salary benchmarks and future prediction tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ingest = [
  "pypdf>=5,<7",
]
web = [
  "Flask>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.2,<2",
]
train = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/salary_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
